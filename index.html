<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও আপলোড ও এমবেড জেনারেটর</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            background: white;
            padding: 20px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="file"] {
            margin: 15px 0;
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .copy-btn {
            background-color: #28a745;
            padding: 6px 12px;
            font-size: 13px;
            margin-top: 5px;
            width: auto;
            display: inline-block;
        }
        .copy-btn:hover { background-color: #218838; }
        textarea {
            width: 100%;
            height: 60px;
            margin-top: 5px;
            padding: 6px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #007bff;
            word-break: break-word;
        }
        .history-section { margin-top: 30px; text-align: left; }
        .video-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            font-size: 13px;
            color: #444;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📹 ভিডিও আপলোড ও এমবেড জেনারেটর</h2>
    <input type="file" id="videoInput" accept="video/*"><br>
    <button onclick="uploadVideo()">ভিডিও আপলোড করুন</button>
    
    <div id="status"></div>

    <!-- আপলোড করা সব ভিডিওর তালিকা এখানে দেখাবে -->
    <div class="history-section" id="historySection" style="display:none;">
        <h3>আপলোড করা ভিডিওসমূহ:</h3>
        <div id="historyList"></div>
    </div>
</div>

<script>
    // আপনার দেয়া Cloudinary তথ্য বসানো হয়েছে
    const cloudName = "ie3bofhp"; 
    const uploadPreset = "my_video_upload"; 

    let videoCount = 0;

    async function uploadVideo() {
        const fileInput = document.getElementById('videoInput');
        const file = fileInput.files[0];
        
        if (!file) {
            alert('অনুগ্রহ করে একটি ভিডিও ফাইল সিলেক্ট করুন!');
            return;
        }

        const statusDiv = document.getElementById('status');
        statusDiv.innerText = `⏳ "${file.name}" আপলোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।`;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', uploadPreset);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.secure_url) {
                statusDiv.innerText = '✅ আপলোড সফল হয়েছে!';
                const videoUrl = data.secure_url;
                videoCount++;

                // ১. HTML ভিডিও প্লেয়ার কোড (ঠিক আপনার স্ক্রিনশটের মতো দেখাবে)
                const videoTagHTML = `<video width="100%" controls>\n  <source src="${videoUrl}" type="video/mp4">\n  আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।\n</video>`;

                // ২. iFrame কোড
                const iframeHTML = `<iframe src="${videoUrl}" width="100%" height="360" frameborder="0" allowfullscreen></iframe>`;

                // লিস্টে যুক্ত করার জন্য HTML কার্ড তৈরি
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <h4 style="margin:0 0 10px 0; color:#007bff;">ভিডিও #${videoCount}: ${file.name}</h4>
                    
                    <div style="margin-bottom:12px;">
                        <label>১. HTML Player Code (স্ক্রিনশটের মতো প্লেয়ার):</label>
                        <textarea id="code1_${videoCount}" readonly>${videoTagHTML}</textarea>
                        <button class="copy-btn" onclick="copyText('code1_${videoCount}')">কোড কপি করুন</button>
                    </div>

                    <div style="margin-bottom:12px;">
                        <label>২. iFrame Embed Code (ব্লগ বা ওয়েবসাইটের জন্য):</label>
                        <textarea id="code2_${videoCount}" readonly>${iframeHTML}</textarea>
                        <button class="copy-btn" onclick="copyText('code2_${videoCount}')">কোড কপি করুন</button>
                    </div>

                    <div style="margin-bottom:12px;">
                        <label>৩. ডাইরেক্ট ভিডিও লিঙ্ক (Direct URL):</label>
                        <textarea id="code3_${videoCount}" readonly>${videoUrl}</textarea>
                        <button class="copy-btn" onclick="copyText('code3_${videoCount}')">লিঙ্ক কপি করুন</button>
                    </div>

                    <div style="margin-top:10px;">
                        <label>ভিডিও প্রিভিউ:</label>
                        <div style="margin-top:5px; background:#000; border-radius:5px; overflow:hidden;">${videoTagHTML}</div>
                    </div>
                `;

                // নতুন ভিডিওটি সবার ওপরে দেখাবে
                const historyList = document.getElementById('historyList');
                historyList.insertBefore(card, historyList.firstChild);

                document.getElementById('historySection').style.display = 'block';
                
                // ইনপুট ক্লিয়ার করা
                fileInput.value = '';
            } else {
                statusDiv.innerText = '❌ আপলোড ব্যর্থ হয়েছে। আপনার Unsigned Preset সঠিকভাবে সেট করা আছে কিনা চেক করুন।';
            }
        } catch (error) {
            console.error(error);
            statusDiv.innerText = '❌ একটি সমস্যা হয়েছে! ইন্টারনেট কানেকশন চেক করে আবার চেষ্টা করুন।';
        }
    }

    function copyText(elementId) {
        const copyText = document.getElementById(elementId);
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("কপি করা হয়েছে!");
    }
</script>

</body>
</html>
